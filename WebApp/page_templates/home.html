<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Biletomania</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .welcome-box { border: 2px solid #009688; display: inline-block; padding: 10px; border-radius: 10px; }
        .custom-btn {width: 25%; padding: 20px;}
        img {width: 100%;object-fit: contain; /* Obrazek zachowuje proporcje i nie rozciąga się */
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1>Cześć!</h1>
        <p>Który rodzaj wydarzenia Cię interesuje ?</p>
        <form action="/pick_event" method="post">
        {% for event in event_list %}
             <button class="custom-btn" name="event_num" value="{{ loop.index0 }}">
                <img src="{{url_for('static',path='/images/'+event+'.jpg')}}"  alt="{{event}}">
                <p>{{event}}</p>
            </button>
        {% endfor %}
    </form>
    </div>
</body>
</html>
